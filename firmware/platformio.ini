; ESP32 bench node: ADS1115 PT1/PT2 pressure + one main Hall-effect flow sensor.
; Build:  pio run -e esp32dev -t upload
; Monitor: pio device monitor -b 115200
; OTA:     pio run -e esp32dev_ota -t upload   (after one USB flash with OTA code)
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    adafruit/Adafruit ADS1X15@^2.4.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Flash over WiFi. The first flash that adds OTA support must still go over USB.
; upload_port: the node's IP (printed as "[ota] ready" on boot) or esp32-bench-01.local
; if mDNS resolves on this machine (Arch needs nss-mdns + avahi for .local).
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 10.58.251.208
upload_flags =
    --auth=${sysenv.HYDROPIN_OTA_PASSWORD}
; Remote log mirror (telnet, port 23): pio device monitor -e esp32dev_ota
monitor_port = socket://10.58.251.208:23
