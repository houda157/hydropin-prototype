# Publishes the static dashboard (replay mode) to GitHub Pages on every push to main.
# Settings -> Pages -> Source: "GitHub Actions". Live mode only works when the laptop backend serves
# the dashboard (Pages is https and cannot open ws:// to the laptop).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/farm-explorer _site/twin
          cp -r dashboard/. _site/
          rm -f _site/app.py                                  # Streamlit app, not part of the static site
          cp farm/explorer/index.html farm/explorer/farm-data.js _site/farm-explorer/
          cp simulator/demo/hydropin_viewer.html _site/twin/
          touch _site/.nojekyll
          ls -R _site | head -50
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
