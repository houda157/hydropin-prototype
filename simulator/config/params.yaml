    source: Recommended range for drip networks
    range: [4.0, 10.0]
  ACC:
    value: 0.0025
    unit: "-"
    symbol: ACC
    meaning: Accuracy as a fraction of full scale
    source: Typical industrial transmitter datasheet
    range: [0.001, 0.01]
    verify: true
  TEMPCO:
    value: 0.0002
    unit: 1/K
    symbol: \alpha_T
    meaning: Zero drift per kelvin, fraction of full scale
    source: Typical datasheet (0.2 % span / 10 K)
    range: [0.0, 0.001]
    verify: true
  T_AMP:
    value: 15.0
    unit: K
    symbol: T_{amp}
    meaning: Half-amplitude of the daily temperature swing at the sensor box
    source: Assumption for a field box in Tunisian summer
    range: [0.0, 25.0]
    verify: true
  DRIFT_YR:
    value: 0.002
    unit: 1/yr
    symbol: \beta
    meaning: Ageing drift per year, fraction of full scale
    source: Typical datasheet long-term stability
    range: [0.0, 0.005]
    verify: true
  SIGMA_N:
    value: 0.0005
    unit: "-"
    symbol: \sigma_\varepsilon
    meaning: Short-term noise standard deviation, fraction of full scale
    source: Assumption; to measure on the bench
    range: [0.0, 0.005]
    verify: true
  ADC_BITS:
    value: 16
    unit: bit
    symbol: n_b
    meaning: ADC resolution (ADS1115)
    source: Hardware choice
    range: [10, 24]
  LOSS_RATE:
    value: 0.02
    unit: "-"
    symbol: LOSS
    meaning: LoRa packet loss probability
    source: Assumption
    range: [0.0, 0.3]
    verify: true
  FS_HIGH:
    value: 2000.0
    unit: Hz
    symbol: f_s
    meaning: M3 high-rate sampling frequency
    source: Blueprint (>= 2 kHz)
    range: [1000.0, 100000.0]
  TAU_SENS:
    value: 1.0e-3
    unit: s
    symbol: \tau_s
    meaning: M3 sensor response time
    source: Typical piezo-resistive sensor datasheet
    range: [1.0e-5, 5.0e-3]
    verify: true
  SIGMA_SYNC:
    value: 1.0e-6
    unit: s
    symbol: \sigma_{sync}
    meaning: GPS time-sync error between M3 sensors
    source: Typical GPS PPS accuracy
    range: [0.0, 1.0e-3]
    verify: true

  TEMP_COMP_RESIDUAL:
    value: 0.1
    unit: "-"
    symbol: \rho_T
    meaning: Fraction of the daily temperature drift left after compensation with the box temperature
    source: Assumption; to measure on the bench (math note §3.3)
    range: [0.0, 1.0]
    verify: true
  SIGMA_Q:
    value: 0.005
    unit: "-"
    symbol: \sigma_Q
    meaning: Flow-meter noise, fraction of the reading
    source: Typical electromagnetic flow meter (0.5 %)
    range: [0.001, 0.05]
