pipes:
  C1:
    value: 1.0
    unit: "-"
    symbol: c_1
    meaning: Pipe anchoring factor in the wave-speed formula (1 = free to move)
    source: Math note §5.2; farm pipes loosely buried or on the surface
    range: [0.5, 1.2]

