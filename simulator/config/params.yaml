    NU_P:
      value: 0.40
      unit: "-"
      symbol: \nu_p
      meaning: Poisson ratio
      source: Typical PVC literature value
      range: [0.38, 0.46]
      verify: true
    EPS_R:
      value: 1.5e-6
      unit: m
      symbol: \varepsilon
      meaning: Absolute roughness (new pipe)
      source: Typical plastic pipe value
      range: [1.5e-6, 1.0e-5]
    J_K:
      value: []
      unit: 1/Pa
      symbol: J_k
      meaning: Kelvin-Voigt creep compliances (PVC treated as elastic)
      source: Modelling choice
    TAU_K:
      value: []
      unit: s
      symbol: \tau_k
      meaning: Kelvin-Voigt retardation times (PVC treated as elastic)
      source: Modelling choice
  PE100:
