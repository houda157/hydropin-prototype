    meaning: Nominal dripper flow (= 2 L/h)
    source: Typical dripper datasheet
    range: [5.5556e-7, 1.1112e-6]
    verify: true
  H_NOM:
    value: 10.0
    unit: m
    symbol: h_{nom}
    meaning: Nominal dripper pressure head (about 1 bar)
    source: Typical dripper datasheet
    range: [5.0, 20.0]
    verify: true
  X_EMIT:
    value: 0.5
    unit: "-"
    symbol: x
    meaning: Dripper exponent (0.5 non-compensating, 0-0.1 pressure-compensating)
    source: Typical dripper datasheet
    range: [0.0, 1.0]
    verify: true
  H_ACT:
    value: 7.0
    unit: m
    symbol: h_{act}
    meaning: Activation head of pressure-compensating drippers
    source: Typical PC dripper datasheet
    range: [5.0, 10.0]
    verify: true
  H_MAX:
    value: 35.0
    unit: m
    symbol: h_{max}
    meaning: Upper limit of the compensation range
    source: Typical PC dripper datasheet
    range: [30.0, 40.0]
    verify: true
  CV_MFG:
    value: 0.05
    unit: "-"
    symbol: c_v
    meaning: Manufacturing coefficient of variation of k_d
    source: Typical dripper datasheet (classes A/B)
