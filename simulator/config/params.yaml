# HydroPin – simulation parameters (single source of truth)
#
# Every constant used anywhere in the code is read from this file.
# Code names, symbols and defaults mirror docs/math.md, section 0.
#
# Fields of each parameter:
#   value   : number, list of numbers, or null (null = not known yet → any use raises an error)
#   unit    : SI unit ("-" = dimensionless)
#   symbol  : LaTeX symbol used in the math note
#   meaning : one-line description
#   source  : where the value comes from
#   range   : [min, max] plausible values; the loader rejects values outside it
#   verify  : true = literature placeholder, to replace with a datasheet or bench value
#   at, at_unit : abscissa for tabulated parameters (e.g. water temperature)
#
# Units: SI everywhere. Pressure is pressure HEAD in metres of water. Flow in m3/s.

meta:
  version: 0.1.0
  math_note: "docs/math.md"
  units: SI (head in m of water, flow in m3/s)

# ── 0.1 Water and physics ──────────────────────────────────────────────────────
water:
  G:
    value: 9.81
    unit: m/s2
    symbol: g
    meaning: Gravitational acceleration
    source: Standard value
    range: [9.78, 9.83]
  RHO_W:
    value: 998.2
    unit: kg/m3
    symbol: \rho
    meaning: Water density at 20 °C
    source: Standard water tables
    range: [990.0, 1000.0]
  NU_W:
    value: [1.306e-6, 1.004e-6, 0.801e-6, 0.658e-6]
    at: [10.0, 20.0, 30.0, 40.0]
    at_unit: degC
    unit: m2/s
    symbol: \nu
    meaning: Kinematic viscosity of water vs temperature (interpolated)
    source: Standard water tables
    range: [0.5e-6, 1.5e-6]
  K_W:
    value: 2.2e9
    unit: Pa
    symbol: K
    meaning: Bulk modulus of water
    source: Standard value (Wylie & Streeter)
    range: [2.0e9, 2.3e9]
  P_ATM:
    value: 101325.0
    unit: Pa
    symbol: p_{atm}
    meaning: Atmospheric pressure (sea level)
    source: Standard atmosphere
    range: [90000.0, 105000.0]
  P_VAP:
    value: [1228.0, 2339.0, 4246.0, 7384.0]
    at: [10.0, 20.0, 30.0, 40.0]
    at_unit: degC
    unit: Pa
    symbol: p_v
    meaning: Vapour pressure of water vs temperature (interpolated)
    source: Standard water tables
    range: [500.0, 10000.0]
  T_WATER:
    value: 20.0
    unit: degC
    symbol: T_w
    meaning: Default water temperature (overridden per scenario)
    source: Choice; surface laterals run hotter in summer
    range: [5.0, 45.0]

