    source: Assumption (piezo-resistive sensor + 24-bit ADC); to measure on the bench
    range: [0.0005, 0.05]
    verify: true
  N_PULSES:
    value: 16
    unit: "-"
    symbol: N_p
    meaning: Number of identical M3 pulses averaged in one test
    source: Design choice (math note §5.9)
    range: [1, 100]

decision:
  KAPPA:
    value: 3.0
    unit: "-"
    symbol: \kappa
    meaning: Detection margin in multiples of the noise
    source: Modelling choice
    range: [1.0, 6.0]
  TAU1:
    value: 0.3
