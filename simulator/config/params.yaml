      range: [0.15e9, 0.35e9]
      verify: true
    NU_P:
      value: 0.46
      unit: "-"
      symbol: \nu_p
      meaning: Poisson ratio
      source: Typical PE literature value
      range: [0.42, 0.49]
      verify: true
    EPS_R:
      value: 1.5e-6
      unit: m
      symbol: \varepsilon
